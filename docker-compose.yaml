services:
  server:
    image: server
    build: .
    command: /app/server
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    ports:
      - "1337:1337"
    depends_on:
      - rabbitmq
    restart: always

  client_tg:
    image: client_tg
    build: .
    command: /app/telegram_consumer
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    ports:
      - "8081:8081"
    depends_on:
      - rabbitmq
    restart: always

  client_email:
    image: client_email
    build: .
    command: /app/email_consumer
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    ports:
      - "8082:8082"
    depends_on:
      - rabbitmq
    restart: always

  rabbitmq:
    build:
      context: .
      dockerfile: Dockerfile.rabbitmq
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
